name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: |
          cd backend
          uv sync --all-groups

      - name: Check formatting with Ruff
        run: |
          cd backend
          uv run ruff check .

      - name: Check formatting with Black
        run: |
          cd backend
          uv run black --check .

      - name: Run Pytest
        run: |
          cd backend
          uv run pytest

      - name: Coverage
        run: |
          cd backend
          uv run pytest --cov=app tests/
