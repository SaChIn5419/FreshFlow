[project]
name = "wholesale-vegetable-procurement"
version = "1.0.0"
description = "Backend for FreshFlow wholesale vegetable procurement"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "sqlalchemy>=2.0,<2.2",
    "alembic>=1.13.1",
    "psycopg[binary]>=3.1.19",
    "pydantic[email]>=2.7.4",
    "pydantic-settings>=2.3.4",
    "bcrypt>=4.0.0",
    "pyjwt>=2.8.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",
    "weasyprint>=62.3",
    "jinja2>=3.1.4",
]

[dependency-groups]
dev = [
    "black",
    "ruff",
    "ipython",
]
test = [
    "pytest>=8.2.2",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.7",
    "httpx>=0.27.0",
]
docs = [
    "mkdocs",
    "mkdocs-material",
]

[tool.ruff]
target-version = "py312"
line-length = 88
ignore = ["E712", "F403", "F401"]

[tool.black]
target-version = ['py312']
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
